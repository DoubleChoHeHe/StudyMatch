<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khám phá — StudyMatch</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div id="appHeader"></div>

  <main class="main-content">
    <div class="container">
      <div class="text-center mb-3">
        <h1>Khám phá bạn học</h1>
        <p class="text-muted">Vuốt hoặc nhấn nút để tìm người phù hợp · Phím ← Bỏ qua · → Thích</p>
      </div>

      <!-- Filters -->
      <div class="filters-bar">
        <select id="filterSubject" class="form-select" onchange="applyFilters()" aria-label="Lọc môn học">
          <option value="">Tất cả môn</option>
        </select>
        <select id="filterStyle" class="form-select" onchange="applyFilters()" aria-label="Lọc phong cách">
          <option value="">Tất cả phong cách</option>
        </select>
        <select id="filterAvail" class="form-select" onchange="applyFilters()" aria-label="Lọc thời gian">
          <option value="">Tất cả thời gian</option>
        </select>
        <select id="filterMethod" class="form-select" onchange="applyFilters()" aria-label="Lọc phương thức">
          <option value="">Online/Trực tiếp</option>
          <option value="online">Online</option>
          <option value="offline">Trực tiếp</option>
          <option value="both">Cả hai</option>
        </select>
        <select id="filterMinPct" class="form-select" onchange="applyFilters()" aria-label="Lọc % match">
          <option value="">Mọi % match</option>
          <option value="50">≥ 50%</option>
          <option value="70">≥ 70%</option>
          <option value="85">≥ 85%</option>
        </select>
        <button class="btn btn-ghost btn-sm" onclick="resetFilters()">
          <i class="fas fa-redo"></i> Reset
        </button>
      </div>

      <!-- Discover Card -->
      <div class="discover-container mb-4" id="discoverCard">
        <div class="loading"><div class="spinner"></div> Đang tải...</div>
      </div>

      <!-- Recommendations Section -->
      <section class="mt-4">
        <h2 class="mb-3"><i class="fas fa-star text-primary"></i> Bạn học được đề xuất</h2>
        <div class="rec-grid" id="recList"></div>
      </section>

      <!-- Quote -->
      <div class="mt-4" id="quoteContainer"></div>
    </div>
  </main>

  <div id="appFooter"></div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/matching.js"></script>
  <script src="js/app.js"></script>
  <script src="js/discover.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initPage('discover');
      initDiscover();
    });
  </script>
  <script>
    (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...args)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="-485k80XutrBqQQOvvlqV";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
  </script>
</body>
</html>
