<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Góp ý — StudyMatch</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div id="appHeader"></div>

  <main class="main-content">
    <div class="container-md">
      <div class="text-center mb-4 animate-fadeInUp">
        <h1><i class="fas fa-comment-dots text-primary"></i> Góp ý & Phản hồi</h1>
        <p class="text-muted">Ý kiến của bạn giúp StudyMatch hoàn thiện hơn.</p>
      </div>

      <div id="feedbackSuccess" class="alert alert-success hidden" role="status">
        <i class="fas fa-check-circle"></i>
        Cảm ơn bạn! Phản hồi đã được lưu (localStorage).
      </div>
      <div id="feedbackError" class="alert alert-error hidden" role="alert"></div>

      <div class="card animate-fadeInUp mb-4">
        <form id="feedbackForm" onsubmit="submitFeedback(event)">
          <div class="form-group">
            <label class="form-label" for="fbName">Họ tên</label>
            <input type="text" id="fbName" class="form-input" placeholder="Nguyễn Văn A" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="fbEmail">Email</label>
            <input type="email" id="fbEmail" class="form-input" placeholder="email@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Bạn đánh giá StudyMatch thế nào?</label>
            <div class="options-grid" id="ratingGrid" style="grid-template-columns:repeat(5,1fr);">
              <button type="button" class="option-card rating-btn" data-rating="1" onclick="selectRating(1)" aria-label="1 sao">
                <i class="fas fa-star"></i><span>1</span>
              </button>
              <button type="button" class="option-card rating-btn" data-rating="2" onclick="selectRating(2)" aria-label="2 sao">
                <i class="fas fa-star"></i><span>2</span>
              </button>
              <button type="button" class="option-card rating-btn" data-rating="3" onclick="selectRating(3)" aria-label="3 sao">
                <i class="fas fa-star"></i><span>3</span>
              </button>
              <button type="button" class="option-card rating-btn" data-rating="4" onclick="selectRating(4)" aria-label="4 sao">
                <i class="fas fa-star"></i><span>4</span>
              </button>
              <button type="button" class="option-card rating-btn" data-rating="5" onclick="selectRating(5)" aria-label="5 sao">
                <i class="fas fa-star"></i><span>5</span>
              </button>
            </div>
            <input type="hidden" id="fbRating" value="">
          </div>
          <div class="form-group">
            <label class="form-label" for="fbType">Loại phản hồi</label>
            <select id="fbType" class="form-select" required>
              <option value="">Chọn...</option>
              <option value="bug">Báo lỗi</option>
              <option value="feature">Đề xuất tính năng</option>
              <option value="ui">Giao diện / UX</option>
              <option value="content">Nội dung</option>
              <option value="other">Khác</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="fbMessage">Nội dung góp ý *</label>
            <textarea id="fbMessage" class="form-textarea" rows="5" placeholder="Chia sẻ trải nghiệm, lỗi gặp phải hoặc ý tưởng của bạn..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">
            <i class="fas fa-paper-plane"></i> Gửi phản hồi
          </button>
        </form>
      </div>

      <div class="card animate-fadeInUp">
        <h3 class="mb-2"><i class="fas fa-inbox text-primary"></i> Phản hồi gần đây (trên máy bạn)</h3>
        <p class="text-sm text-muted mb-2">Lưu trong localStorage key <code>studyMatchFeedback</code> — chỉ xem được trên trình duyệt này.</p>
        <div id="feedbackList">
          <p class="text-muted text-sm">Chưa có phản hồi nào.</p>
        </div>
      </div>
    </div>
  </main>

  <div id="appFooter"></div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/matching.js"></script>
  <script src="js/app.js"></script>
  <script>
    let selectedRating = 0;

    document.addEventListener('DOMContentLoaded', () => {
      initPage('feedback');
      const user = getCurrentUser();
      if (user) {
        document.getElementById('fbName').value = user.name || '';
        document.getElementById('fbEmail').value = user.email || '';
      }
      renderFeedbackList();
    });

    function selectRating(n) {
      selectedRating = n;
      document.getElementById('fbRating').value = String(n);
      document.querySelectorAll('.rating-btn').forEach(btn => {
        const r = parseInt(btn.dataset.rating, 10);
        btn.classList.toggle('selected', r <= n);
      });
    }

    function getFeedbacks() {
      try {
        return JSON.parse(localStorage.getItem('studyMatchFeedback') || '[]');
      } catch {
        return [];
      }
    }

    function saveFeedbacks(list) {
      localStorage.setItem('studyMatchFeedback', JSON.stringify(list));
    }

    function submitFeedback(e) {
      e.preventDefault();
      const err = document.getElementById('feedbackError');
      const ok = document.getElementById('feedbackSuccess');
      err.classList.add('hidden');
      ok.classList.add('hidden');

      const name = document.getElementById('fbName').value.trim();
      const email = document.getElementById('fbEmail').value.trim();
      const type = document.getElementById('fbType').value;
      const message = document.getElementById('fbMessage').value.trim();
      const rating = selectedRating;

      if (!name || !email || !type || !message) {
        err.textContent = 'Vui lòng điền đầy đủ thông tin bắt buộc.';
        err.classList.remove('hidden');
        return;
      }
      if (!rating) {
        err.textContent = 'Vui lòng chọn số sao đánh giá.';
        err.classList.remove('hidden');
        return;
      }

      const list = getFeedbacks();
      list.unshift({
        id: 'fb_' + Date.now(),
        name,
        email,
        type,
        rating,
        message,
        createdAt: new Date().toISOString()
      });
      saveFeedbacks(list);

      document.getElementById('feedbackForm').reset();
      selectedRating = 0;
      document.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('selected'));
      ok.classList.remove('hidden');
      renderFeedbackList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderFeedbackList() {
      const list = getFeedbacks().slice(0, 5);
      const el = document.getElementById('feedbackList');
      if (!list.length) {
        el.innerHTML = '<p class="text-muted text-sm">Chưa có phản hồi nào.</p>';
        return;
      }
      const typeLabel = {
        bug: 'Báo lỗi',
        feature: 'Tính năng',
        ui: 'UI/UX',
        content: 'Nội dung',
        other: 'Khác'
      };
      el.innerHTML = list.map(f => `
        <div class="ai-suggestion" style="margin-bottom:10px;">
          <i class="fas fa-user"></i>
          <div>
            <h4>${escapeHtml(f.name)} · ${'★'.repeat(f.rating)}${'☆'.repeat(5 - f.rating)}
              <span class="tag" style="margin-left:8px;">${typeLabel[f.type] || f.type}</span>
            </h4>
            <p>${escapeHtml(f.message)}</p>
            <p class="text-sm text-muted">${new Date(f.createdAt).toLocaleString('vi-VN')}</p>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }
  </script>
  <script>
    (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...args)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="-485k80XutrBqQQOvvlqV";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
  </script>
</body>
</html>
