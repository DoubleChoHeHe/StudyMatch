<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sở thích học tập — StudyMatch</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div id="appHeader"></div>

  <main class="main-content">
    <div class="container-md">
      <div class="text-center mb-4">
        <h1>Sở thích học tập</h1>
        <p class="text-muted">Giúp chúng tôi tìm bạn học phù hợp nhất với bạn.</p>
        <div class="progress-bar" style="max-width:300px;margin:16px auto 0;">
          <div class="progress-fill" style="width:66%;"></div>
        </div>
        <p class="text-sm text-muted mt-1">Bước 2/3</p>
      </div>

      <!-- Learning Style -->
      <div class="card mb-3">
        <h3 class="mb-2"><i class="fas fa-brain text-primary"></i> Phong cách học</h3>
        <div class="options-grid" id="styleGrid"></div>
      </div>

      <!-- Study Method -->
      <div class="card mb-3">
        <h3 class="mb-2"><i class="fas fa-laptop text-primary"></i> Phương thức học</h3>
        <div class="options-grid" id="methodGrid"></div>
      </div>

      <!-- Availability -->
      <div class="card mb-3">
        <h3 class="mb-2"><i class="fas fa-clock text-primary"></i> Thời gian rảnh</h3>
        <div class="options-grid" id="availGrid"></div>
      </div>

      <!-- Duration -->
      <div class="card mb-3">
        <h3 class="mb-2"><i class="fas fa-hourglass-half text-primary"></i> Thời lượng học</h3>
        <div class="options-grid" id="durationGrid"></div>
      </div>

      <!-- Level -->
      <div class="card mb-4">
        <h3 class="mb-2"><i class="fas fa-signal text-primary"></i> Trình độ</h3>
        <div class="options-grid" id="levelGrid"></div>
      </div>

      <div class="text-center">
        <button class="btn btn-primary btn-lg" onclick="savePreferences()">
          <i class="fas fa-check"></i> Hoàn tất & Khám phá
        </button>
        <p class="text-sm text-muted mt-2">
          <a href="subjects.html">← Quay lại chọn môn</a>
        </p>
      </div>
    </div>
  </main>

  <div id="appFooter"></div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/matching.js"></script>
  <script src="js/app.js"></script>
  <script>
    let prefs = {
      learningStyle: '',
      studyMethod: '',
      availability: [],
      duration: '',
      level: ''
    };

    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth()) return;
      initPage('');

      const user = getCurrentUser();
      prefs.learningStyle = user.learningStyle || '';
      prefs.studyMethod = user.studyMethod || '';
      prefs.availability = [...(user.availability || [])];
      prefs.duration = user.duration || '';
      prefs.level = user.level || '';

      renderAll();
    });

    function renderAll() {
      renderSingle('styleGrid', LEARNING_STYLES, 'learningStyle');
      renderSingle('methodGrid', STUDY_METHODS, 'studyMethod');
      renderMulti('availGrid', AVAILABILITY, 'availability');
      renderSingle('durationGrid', DURATIONS, 'duration');
      renderSingle('levelGrid', LEVELS, 'level');
    }

    function renderSingle(gridId, items, key) {
      const grid = document.getElementById(gridId);
      grid.innerHTML = items.map(item => `
        <div class="option-card ${prefs[key] === item.id ? 'selected' : ''}"
             onclick="selectSingle('${key}', '${item.id}')" role="button" tabindex="0">
          ${item.icon ? `<i class="${item.icon}"></i>` : ''}
          <span>${item.name}</span>
        </div>
      `).join('');
    }

    function renderMulti(gridId, items, key) {
      const grid = document.getElementById(gridId);
      grid.innerHTML = items.map(item => `
        <div class="option-card ${prefs[key].includes(item.id) ? 'selected' : ''}"
             onclick="toggleMulti('${key}', '${item.id}')" role="button" tabindex="0">
          ${item.icon ? `<i class="${item.icon}"></i>` : ''}
          <span>${item.name}</span>
        </div>
      `).join('');
    }

    function selectSingle(key, id) {
      prefs[key] = id;
      renderAll();
    }

    function toggleMulti(key, id) {
      const idx = prefs[key].indexOf(id);
      if (idx >= 0) prefs[key].splice(idx, 1);
      else prefs[key].push(id);
      renderAll();
    }

    function savePreferences() {
      updateCurrentUser(prefs);
      showToast('Đã lưu sở thích học tập!', 'success');
      setTimeout(() => {
        window.location.href = 'discover.html';
      }, 500);
    }
  </script>
  <script>
    (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...args)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="-485k80XutrBqQQOvvlqV";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
  </script>
</body>
</html>
