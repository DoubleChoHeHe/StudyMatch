<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang hoàn thiện — StudyMatch</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div id="appHeader"></div>

  <main class="main-content">
    <div class="container">
      <div class="empty-state animate-scaleIn" style="padding:80px 20px;">
        <i class="fas fa-tools" style="font-size:5rem;color:var(--primary-bright);filter:drop-shadow(0 0 20px rgba(167,139,250,0.4));"></i>
        <h1 class="mt-3 mb-2">Website đang hoàn thiện</h1>
        <p class="text-muted text-lg mb-3">
          Trang này chưa sẵn sàng. Vui lòng quay lại sau.

          <i class="fas fa-wrench"></i> Đội ngũ StudyMatch đang xây dựng thêm nội dung…

        <div class="flex gap-2 flex-center flex-wrap">
          <a href="index.html" class="btn btn-primary btn-lg">
            <i class="fas fa-home"></i> Về trang chủ
          </a>
          <a href="about.html" class="btn btn-outline btn-lg">
            <i class="fas fa-info-circle"></i> Giới thiệu
          </a>
          <button type="button" class="btn btn-ghost btn-lg" onclick="history.back()">
            <i class="fas fa-arrow-left"></i> Quay lại
          </button>
        </div>
      </div>
    </div>

  <div id="appFooter"></div>

  <script src="js/data.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => initPage(''));
  </script>
  <script>
    (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...args)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="-485k80XutrBqQQOvvlqV";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
  </script>
