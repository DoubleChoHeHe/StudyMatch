<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — StudyMatch</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card animate-scaleIn">
      <div class="text-center mb-3">
        <a href="index.html" class="logo" style="justify-content:center;font-size:1.6rem;">
          <i class="fas fa-graduation-cap"></i> StudyMatch
        </a>
      </div>
      <h1>Đăng nhập</h1>
      <p class="subtitle">Chào mừng trở lại! Hãy tiếp tục hành trình học tập.</p>

      <div id="loginError" class="alert alert-error hidden" role="alert"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="identifier">Email hoặc Username</label>
          <div class="input-icon">
            <i class="fas fa-user"></i>
            <input type="text" id="identifier" class="form-input" placeholder="email@example.com" required autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu</label>
          <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="remember" checked>
          <label for="remember">Ghi nhớ đăng nhập</label>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i class="fas fa-sign-in-alt"></i> Đăng nhập
        </button>
      </form>

      <div class="auth-footer">
        Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
      </div>

      <div class="mt-3 text-center">
        <p class="text-sm text-muted">Demo: dùng tài khoản demo như <code>alex@studymatch.demo</code> / <code>demo123</code></p>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      redirectIfAuthenticated();
    });

    function handleLogin(e) {
      e.preventDefault();
      const identifier = document.getElementById('identifier').value;
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;
      const errorEl = document.getElementById('loginError');

      const result = loginUser(identifier, password, remember);

      if (result.success) {
        errorEl.classList.add('hidden');
        const user = result.user;
        if (!user.subjects || user.subjects.length === 0) {
          window.location.href = 'subjects.html';
        } else {
          window.location.href = 'discover.html';
        }
      } else {
        errorEl.textContent = result.message;
        errorEl.classList.remove('hidden');
      }
    }
  </script>
  <script>
    (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...args)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="-485k80XutrBqQQOvvlqV";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
  </script>
</body>
</html>
