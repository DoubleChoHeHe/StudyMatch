<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký — StudyMatch</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card animate-scaleIn" style="max-width:500px;">
      <div class="text-center mb-3">
        <a href="index.html" class="logo" style="justify-content:center;font-size:1.6rem;">
          <i class="fas fa-graduation-cap"></i> StudyMatch
        </a>
      </div>
      <h1>Tạo tài khoản</h1>
      <p class="subtitle">Bắt đầu tìm bạn học phù hợp với bạn.</p>

      <div id="registerError" class="alert alert-error hidden" role="alert"></div>

      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label" for="name">Họ và tên *</label>
          <input type="text" id="name" class="form-input" placeholder="Nguyễn Văn A" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="username">Username *</label>
          <input type="text" id="username" class="form-input" placeholder="nguyenvana" required pattern="[a-zA-Z0-9_]{3,20}" title="3-20 ký tự, chỉ chữ, số và _">
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email *</label>
          <input type="email" id="email" class="form-input" placeholder="email@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu *</label>
          <input type="password" id="password" class="form-input" placeholder="Ít nhất 6 ký tự" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Xác nhận mật khẩu *</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="Nhập lại mật khẩu" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="age">Tuổi *</label>
          <input type="number" id="age" class="form-input" placeholder="18" min="13" max="99" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="school">Trường / Đại học</label>
          <input type="text" id="school" class="form-input" placeholder="Đại học Bách Khoa">
        </div>
        <div class="form-group">
          <label class="form-label" for="avatarFile">Ảnh đại diện (tùy chọn)</label>
          <input type="file" id="avatarFile" class="form-input" accept="image/*" onchange="previewAvatar(event)">
          <p class="form-hint">Tải ảnh từ máy (JPG/PNG, tối đa ~2MB). Ảnh lưu dạng Base64 trong localStorage.</p>
          <div id="avatarPreviewWrap" class="mt-2 hidden" style="text-align:center;">
            <img id="avatarPreview" alt="Xem trước" style="width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid rgba(167,139,250,0.5);">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i class="fas fa-user-plus"></i> Đăng ký
        </button>
      </form>

      <div class="auth-footer">
        Đã có tài khoản? <a href="login.html">Đăng nhập</a>
      </div>
      <p class="text-sm text-muted text-center mt-2">
        Dự án frontend học tập. Mật khẩu lưu plain text trong localStorage — Inspect → Application → Local Storage → studyMatchUsers.
      </p>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    let avatarDataUrl = '';

    document.addEventListener('DOMContentLoaded', () => {
      redirectIfAuthenticated();
    });

    function previewAvatar(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) {
        avatarDataUrl = '';
        document.getElementById('avatarPreviewWrap').classList.add('hidden');
        return;
      }
      if (file.size > 2 * 1024 * 1024) {
        alert('Ảnh tối đa 2MB. Vui lòng chọn ảnh nhỏ hơn.');
        e.target.value = '';
        avatarDataUrl = '';
        document.getElementById('avatarPreviewWrap').classList.add('hidden');
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        avatarDataUrl = reader.result;
        const img = document.getElementById('avatarPreview');
        img.src = avatarDataUrl;
        document.getElementById('avatarPreviewWrap').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    async function handleRegister(e) {
      e.preventDefault();
      const errorEl = document.getElementById('registerError');

      const userData = {
        name: document.getElementById('name').value,
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        confirmPassword: document.getElementById('confirmPassword').value,
        age: document.getElementById('age').value,
        school: document.getElementById('school').value,
        avatar: avatarDataUrl || ''
      };

      const result = registerUser(userData);

      if (result.success) {
        errorEl.classList.add('hidden');
        window.location.href = 'subjects.html';
      } else {
        errorEl.textContent = result.message;
        errorEl.classList.remove('hidden');
      }
    }
  </script>
  <script>
    (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...args)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="-485k80XutrBqQQOvvlqV";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
  </script>
</body>
</html>
