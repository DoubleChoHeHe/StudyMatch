<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat — StudyMatch</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div id="appHeader"></div>

  <main class="main-content" style="padding-top:20px;">
    <div class="container">
      <h1 class="mb-3"><i class="fas fa-comments text-primary"></i> Tin nhắn</h1>

      <div class="chat-layout">
        <div class="chat-sidebar" id="chatList">
          <div class="loading"><div class="spinner"></div></div>
        </div>
        <div class="chat-main">
          <div class="chat-header" id="chatHeader">
            <p class="text-muted" style="padding:16px;">Chọn một cuộc trò chuyện để bắt đầu</p>
          </div>
          <div class="chat-messages" id="chatMessages">
            <div class="empty-state">
              <i class="fas fa-comments" style="font-size:2.5rem;color:var(--text-light);"></i>
              <p class="text-muted mt-2">Chọn bạn học từ danh sách bên trái</p>
            </div>
          </div>
          <form class="chat-input-area hidden" id="chatInputArea" onsubmit="sendMessage(event)">
            <input type="text" id="messageInput" class="form-input" placeholder="Nhập tin nhắn..." autocomplete="off" aria-label="Tin nhắn">
            <button type="submit" class="btn btn-primary btn-icon" aria-label="Gửi">
              <i class="fas fa-paper-plane"></i>
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="appFooter"></div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/matching.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chat.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initPage('chat');
      initChat();
    });
  </script>
  <script>
    (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...args)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="-485k80XutrBqQQOvvlqV";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
  </script>
</body>
</html>
